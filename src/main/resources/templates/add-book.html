<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Add Book</title></head>
<body>
<h1>Add New Book</h1>
<form th:action="@{/books/add}" method="post" th:object="${book}">
    Title: <input type="text" th:field="*{title}" /><br/>
    Author: <input type="text" th:field="*{author}" /><br/>
    Price: <input type="number" step="0.01" th:field="*{price}" /><br/>
    <button type="submit">Add</button>
</form>
</body>
</html>
