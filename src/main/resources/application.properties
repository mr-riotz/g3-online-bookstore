# Use file-based H2 (data will persist across app restarts)
spring.datasource.url=jdbc:h2:file:./data/bookdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show SQL in logs (optional, good for debugging)
spring.jpa.show-sql=true

# Automatically update schema but don’t drop data
spring.jpa.hibernate.ddl-auto=update

# Disable Thymeleaf caching during dev
spring.thymeleaf.cache=false
